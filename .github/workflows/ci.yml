name: CI

on:
  push:
    branches-ignore:
      - master
  pull_request:

jobs:
  go:
    name: Go vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
