services:
  jobs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: jobs
    command: ["serve"]
    restart: unless-stopped
    environment:
      CHOOSER_CHAMBERS: ${CHOOSER_CHAMBERS:-senate}
      JOBS_INTERVAL: ${JOBS_INTERVAL:-15m}
      JOBS_PAUSE: ${JOBS_PAUSE:-500ms}
    volumes:
      - data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: api
    restart: unless-stopped
    environment:
      API_ADDR: ${API_ADDR:-:8080}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-*}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - data:/data
    depends_on:
      - jobs

  webapp-builder:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      WEBAPP_INTERVAL: ${WEBAPP_INTERVAL:-900}
    volumes:
      - site:/site
    depends_on:
      - api

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-8081}:80"
    volumes:
      - site:/site:ro
    depends_on:
      - webapp-builder

volumes:
  data:
  site:
