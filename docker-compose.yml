version: "3.8"

services:
  diputadodeldia-back:
    container_name: ddd-back
    build: ./legacy/backend
    ports:
      - "5000:5000"
    volumes:
      - app-data:/app/data

  diputadodeldia-front:
    container_name: ddd-front
    build: ./legacy/frontend
    ports:
      - "3000:3000"

volumes:
  app-data:
