services:
  jobs:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        BINARY: jobs
    command: ["serve"]
    restart: unless-stopped
    environment:
      CHOOSER_CHAMBERS: ${CHOOSER_CHAMBERS:-senate}
      JOBS_INTERVAL: ${JOBS_INTERVAL:-15m}
      JOBS_PAUSE: ${JOBS_PAUSE:-500ms}
    volumes:
      - data:/data

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        BINARY: api
    restart: unless-stopped
    environment:
      API_ADDR: ${API_ADDR:-:8080}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-*}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - data:/data
    depends_on:
      - jobs

volumes:
  data:
